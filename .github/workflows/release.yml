# .github/workflows/release.yml

name: Qt Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # ---------------- LINUX ----------------
          - os: ubuntu-22.04
            qt_version: '6.8.3'
            qt_arch: gcc_64
            qt_tools: ''
            executable_path: build/Kites

          # ---------------- WINDOWS ----------------
          - os: windows-latest
            qt_version: '6.8.3'
            qt_arch: win64_mingw
            qt_tools: 'tools_mingw1310'
            executable_path: build/Kites.exe

          # ---------------- MACOS ----------------
          - os: macos-latest
            qt_version: '6.8.3'
            qt_arch: clang_64
            qt_tools: ''
            executable_path: build/Kites.app

    runs-on: ${{ matrix.os }}

    steps:
      # --------------------------------------------
      # Checkout
      # --------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------
      # Install Qt
      # --------------------------------------------
      - name: Install Qt 
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}

      # --------------------------------------------
      # Configure CMake
      # --------------------------------------------
      - name: Configure
        run: >-
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=20 -DCMAKE_CXX_STANDARD_REQUIRED=ON 

      # --------------------------------------------
      # Build
      # --------------------------------------------
      - name: Build
        run: cmake --build build --config Release -j12

      # ============================================
      # LINUX PACKAGING
      # ============================================
      - name: Install Linux Packaging Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y zip wget fuse libfuse2

      - name: Download linuxdeployqt
        if: runner.os == 'Linux'
        run: |
          wget https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Create Linux AppImage
        if: runner.os == 'Linux'
        env:
          QMAKE : ${{ env.QT_DIR }}/bin/qmake
        run: |
          mkdir -p AppDir/usr/bin
          cp build/Kites AppDir/usr/bin/
          cp resources/icons/kite.png AppDir/Kites.png

          cat > AppDir/Kites.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Kites
          Exec=Kites
          Icon=Kites
          Categories=Utility;
          EOF

          ./linuxdeployqt-continuous-x86_64.AppImage \
            AppDir/Kites.desktop \
            -appimage

      - name: Zip Linux AppImage
        if: runner.os == 'Linux'
        run: |
          archive_name="kites-linux-${GITHUB_REF_NAME}.zip"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"
          zip "$archive_name" *.AppImage

      # ============================================
      # WINDOWS PACKAGING
      # ============================================
      - name: Prepare Windows Package Directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "Kites-$env:GITHUB_REF_NAME-windows"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "build\Kites.exe" $packageDir

      - name: Run windeployqt
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          windeployqt Kites-%GITHUB_REF_NAME%-windows\Kites.exe


      # --------------------------------------------------------
      # Copy MinGW Runtime DLLs
      # --------------------------------------------------------

      - name: Copy MinGW Runtime DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gccPath = Split-Path (Get-Command g++.exe).Source
          $packageDir = "Kites-$env:GITHUB_REF_NAME-windows"

          Copy-Item "$gccPath\libgcc_s_seh-1.dll" $packageDir
          Copy-Item "$gccPath\libstdc++-6.dll" $packageDir
          Copy-Item "$gccPath\libwinpthread-1.dll" $packageDir

      - name: Zip Windows Package
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $packageDir = "Kites-$env:GITHUB_REF_NAME-windows"
          $archiveName = "kites-windows-$env:GITHUB_REF_NAME.zip"
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Compress-Archive `
            -Path "$packageDir\*" `
            -DestinationPath $archiveName

      # ============================================
      # MACOS PACKAGING
      # ============================================
      - name: Run macdeployqt
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/Kites.app

      - name: Zip macOS App
        if: runner.os == 'macOS'
        run: |
          archive_name="kites-macos-${GITHUB_REF_NAME}.zip"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent \
            build/Kites.app \
            "$archive_name"

      # ============================================
      # Upload Release Assets
      # ============================================
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}